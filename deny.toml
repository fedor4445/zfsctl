# cargo-deny policy, checked in CI (see .github/workflows/ci.yml).
# Run it locally with: cargo deny check

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only used at compile time, and it comes in through ratatui 0.29" },
]

[bans]
# Two versions of the same crate are common in a tree like this; warn, do not fail.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
