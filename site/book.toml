[book]
title = "The zfsctl Book"
language = "en"
src = "../docs/book"

[build]
build-dir = "public/book"
create-missing = false

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/terminal.css"]
git-repository-url = "https://github.com/fedor4445/zfsctl"
git-repository-icon = "fab-github"
no-section-label = true
smart-punctuation = false

[output.html.search]
enable = true
limit-results = 20

[output.html.print]
enable = false
