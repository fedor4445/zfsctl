[package]
name = "zfsctl"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
nix = { version = "0.29", features = ["user", "signal", "hostname", "fs"] }
signal-hook = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
vt100 = "=0.15.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Logic-hazard lints from the restriction group
indexing_slicing = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic lints that are noise for a TUI binary
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[[example]]
name = "capture"
test = true
